name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install
        run: pip install -e "python/.[dev]"
      - name: Test
        run: cd python && python -m pytest -q
      - name: Conformance
        run: PYTHONPATH=python/src python conformance/runner.py
      - name: Integration harness unit tests (assertion math + SDK wiring)
        run: |
          python -m pytest -q deploy/integration/test_validate.py
          cd deploy/integration/sdk-service && python -m pytest -q

  go-processor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - working-directory: collector/datastalenessprocessor
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)"
          go test ./...

  go-receiver:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - working-directory: collector/datastalenessreceiver
        run: |
          go build ./...
          go vet ./...
          test -z "$(gofmt -l .)"
          go test ./...

  collector-build:
    # Builds a real Collector with both components via OCB and validates a config.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
      - name: Install OpenTelemetry Collector Builder
        run: go install go.opentelemetry.io/collector/cmd/builder@v0.110.0
      - name: Build custom collector
        run: builder --config=collector/builder-config.yaml
      - name: Validate example config
        run: ./_build/otelcol-datastaleness validate --config=collector/example-config.yaml

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build collector image
        run: docker build -f collector/Dockerfile -t otelcol-datastaleness:ci .

  helm:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: azure/setup-helm@v4
      - name: Lint and render chart
        run: |
          helm lint deploy/helm/datastaleness-collector
          helm template ds deploy/helm/datastaleness-collector > /dev/null

  weaver:
    # Validates the Weaver model with the same tool the Semantic Conventions SIG
    # uses, so the machine-readable convention can't silently drift.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Weaver
        run: |
          curl -sL https://github.com/open-telemetry/weaver/releases/download/v0.24.2/weaver-x86_64-unknown-linux-gnu.tar.xz -o weaver.tar.xz
          tar -xf weaver.tar.xz
          echo "$PWD/weaver-x86_64-unknown-linux-gnu" >> "$GITHUB_PATH"
      - name: Weaver registry check
        run: weaver registry check -r model/registry

  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile preprint
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: paper
          root_file: data-staleness-otel-preprint.tex
